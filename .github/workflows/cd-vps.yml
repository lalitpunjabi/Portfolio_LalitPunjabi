name: Continuous Deployment (AWS EC2 Docker)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repository name to lowercase
        run: |
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}:latest
            ghcr.io/${{ env.REPO_LC }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS Server via SSH
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Deploy Container via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            echo "Pulling latest Docker image: ghcr.io/$REPO_LC:latest"
            sudo docker pull ghcr.io/$REPO_LC:latest
            
            echo "Stopping old container..."
            sudo docker stop devops-portfolio-ui || true
            sudo docker rm devops-portfolio-ui || true
            
            echo "Starting new container..."
            sudo docker run -d \
              --name devops-portfolio-ui \
              --restart unless-stopped \
              -p 8080:80 \
              ghcr.io/$REPO_LC:latest

            echo "Cleaning up dangling images..."
            sudo docker image prune -f
            echo "Deployment successfully completed!"
