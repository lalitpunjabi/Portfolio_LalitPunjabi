name: DevSecOps Vulnerability Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  trivy-scan:
    name: Trivy Security & Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Production Docker Image
        run: |
          docker build \
            --tag app-to-scan:${{ github.sha }} \
            .

      - name: Run Trivy Container Vulnerability Scan
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: image
          image-ref: app-to-scan:${{ github.sha }}
          format: sarif
          output: trivy-image-results.sarif
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Upload Container Scan Results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-results.sarif

      - name: Run Trivy Filesystem Vulnerability & Secret Scan
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          ignore-unfixed: true
          scanners: vuln,secret
          severity: CRITICAL,HIGH

      - name: Run Trivy Dockerfile Misconfiguration Scan
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL