version: '3.8'

services:
  portfolio-ui:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/lalitpunjabi/portfolio_lalitpunjabi:latest
    container_name: devops-portfolio-ui
    restart: unless-stopped
    ports:
      - "8080:8080" # Maps host port 8080 to container unprivileged port 8080
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      - NODE_ENV=production
